name: jvm-memory
description: JVM heap and non-heap usage per RegionServer.
range: false
instant_summary: true
columns: [instance, heap_used_mb, heap_max_mb, heap_used_pct]
summary:
  heap_used_mb:
    aggs: [max, avg, last]
  heap_max_mb:
    aggs: [max, last]
  heap_used_pct:
    aggs: [max, avg, p99, last]
queries:
  - label: heap_used_mb
    expr: |
      hadoop_hbase_memheapusedm{cluster="{{.cluster}}", role="regionserver"}
  - label: heap_max_mb
    expr: |
      hadoop_hbase_memheapmaxm{cluster="{{.cluster}}", role="regionserver"}
  - label: heap_used_pct
    expr: |
      100 * hadoop_hbase_memheapusedm{cluster="{{.cluster}}", role="regionserver"}
        / hadoop_hbase_memheapmaxm{cluster="{{.cluster}}", role="regionserver"}
